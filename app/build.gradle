plugins {
    id 'com.android.application'
}

android {
    namespace 'to.msn.wings.quizvoyagemath'
    compileSdk 34

    defaultConfig {
        applicationId "to.msn.wings.quizvoyagemath"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    //MPAndroidChart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    //JLatex
    implementation 'ru.noties:jlatexmath-android:0.2.0'
    testImplementation 'junit:junit:4.13.2'
    // ユニットテストでは android.jar の org.json がスタブ（呼ぶと例外）になるため、
    // 実装を持つ org.json を差し込んで JSON の解析をテストできるようにする
    testImplementation 'org.json:json:20231013'
    // 端末やエミュレータなしで SQLite・assets を含む処理をテストする
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}